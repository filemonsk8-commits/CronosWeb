<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Históricos Interativos</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary-text: #f8fafc;
      --secondary-text: #94a3b8;
      --accent-color: #38bdf8;
      --accent-year: #f43f5e;
      --border-color: #334155;
      --modal-bg: rgba(15, 23, 42, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 10px;
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--secondary-text);
    }

    .controls {
      max-width: 1000px;
      margin: 0 auto 40px auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    @media (min-width: 600px) {
      .controls {
        flex-direction: row;
      }
    }

    .search-box, .filter-select {
      padding: 14px 18px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 1rem;
      background-color: var(--card-bg);
      color: var(--primary-text);
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box {
      flex: 2;
    }

    .filter-select {
      flex: 1;
      cursor: pointer;
    }

    .search-box:focus, .filter-select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* Grid de Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-color), #818cf8);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      background-color: var(--card-hover);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-year {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent-year);
    }

    .card-category {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-text);
      margin-bottom: 15px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      color: var(--accent-color);
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 10px;
    }

    .card-footer span {
      margin-left: 5px;
      transition: transform 0.2s ease;
    }

    .card:hover .card-footer span {
      transform: translateX(4px);
    }

    /* Modal / Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--secondary-text);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--primary-text);
    }

    .modal-body-text {
      color: #cbd5e1;
      font-size: 1rem;
      margin-top: 20px;
    }

    .section-block {
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .section-title {
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .custom-list {
      list-style: none;
      padding-left: 0;
      margin-top: 8px;
    }

    .custom-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 6px;
    }

    .custom-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--accent-color);
      font-size: 0.8rem;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--secondary-text);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="main-headline">Linha do Tempo Interativa</h1>
    <p id="main-subtext">Carregando dados...</p>
  </header>

  <div class="controls">
    <input type="text" id="search-input" class="search-box" placeholder="Pesquisar por evento, período ou palavra-chave...">
    <select id="category-filter" class="filter-select">
      <option value="all">Todas as Categorias</option>
    </select>
  </div>

  <div class="cards-grid" id="cards-container">
    <!-- Cards injetados via JS -->
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="card-header">
        <span class="card-year" id="modal-year"></span>
        <span class="card-category" id="modal-category"></span>
      </div>
      <h2 class="card-title" id="modal-title" style="font-size: 1.8rem;"></h2>
      <div class="modal-body-text" id="modal-body"></div>
    </div>
  </div>

  <script>
    let eventsData = [];

    function formatYear(yearStr) {
      const year = parseInt(yearStr, 10);
      if (isNaN(year)) return yearStr;
      if (year < 0) return `${Math.abs(year)} a.C.`;
      return `${year} d.C.`;
    }

    function formatEventBody(rawText) {
      if (!rawText) return '';
      const lines = rawText.split('\n');
      let htmlOutput = '';
      let inList = false;

      lines.forEach(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith('→') || trimmed.startsWith('-')) {
          if (!inList) {
            htmlOutput += '<ul class="custom-list">';
            inList = true;
          }
          let itemContent = trimmed.replace(/^[→\-]\s*/, '');
          htmlOutput += `<li>${itemContent}</li>`;
        } else {
          if (inList) {
            htmlOutput += '</ul>';
            inList = false;
          }
          if (trimmed === '') {
            htmlOutput += '<div style="height: 10px;"></div>';
          } else if (trimmed.endsWith(':') || trimmed === 'POR QUÊ?') {
            htmlOutput += `<div class="section-block"><span class="section-title">${trimmed}</span></div>`;
          } else {
            htmlOutput += `<p>${trimmed}</p>`;
          }
        }
      });

      if (inList) htmlOutput += '</ul>';
      return htmlOutput;
    }

    async function loadTimeline() {
      try {
        const response = await fetch('timeline.json');
        if (!response.ok) throw new Error('Erro ao carregar timeline.json');
        
        const data = await response.json();

        if (data.title) {
          document.getElementById('main-headline').textContent = data.title.headline || 'Linha do Tempo';
          document.getElementById('main-subtext').textContent = data.title.text || '';
        }

        eventsData = data.events || [];
        populateCategoryFilter(eventsData);
        renderCards(eventsData);

      } catch (error) {
        console.error(error);
        document.getElementById('main-subtext').textContent = 'Erro ao carregar os dados. Certifique-se de que timeline.json está na mesma pasta.';
      }
    }

    function populateCategoryFilter(events) {
      const categorySelect = document.getElementById('category-filter');
      const categories = new Set();
      events.forEach(event => { if (event.category) categories.add(event.category); });
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function renderCards(events) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (events.length === 0) {
        container.innerHTML = '<div class="no-results">Nenhum evento encontrado.</div>';
        return;
      }

      events.forEach((event, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(event);

        const yearText = event.start_date ? formatYear(event.start_date.year) : '';
        const categoryText = event.category || 'Geral';
        const headlineText = event.text ? event.text.headline : '';

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-year">${yearText}</span>
              <span class="card-category">${categoryText}</span>
            </div>
            <h3 class="card-title">${headlineText}</h3>
          </div>
          <div class="card-footer">
            Ver detalhes <span>→</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openModal(event) {
      document.getElementById('modal-year').textContent = event.start_date ? formatYear(event.start_date.year) : '';
      document.getElementById('modal-category').textContent = event.category || 'Geral';
      document.getElementById('modal-title').textContent = event.text ? event.text.headline : '';
      document.getElementById('modal-body').innerHTML = event.text ? formatEventBody(event.text.text) : '';
      
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function filterEvents() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = eventsData.filter(event => {
        const yearFormatted = event.start_date ? formatYear(event.start_date.year).toLowerCase() : '';
        const rawYear = event.start_date ? event.start_date.year.toString() : '';
        const headline = event.text && event.text.headline ? event.text.headline.toLowerCase() : '';
        const text = event.text && event.text.text ? event.text.text.toLowerCase() : '';
        const category = event.category ? event.category.toLowerCase() : '';

        const matchesSearch = headline.includes(searchTerm) || 
                              text.includes(searchTerm) || 
                              yearFormatted.includes(searchTerm) || 
                              rawYear.includes(searchTerm) ||
                              category.includes(searchTerm);

        const matchesCategory = selectedCategory === 'all' || event.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      renderCards(filtered);
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    document.getElementById('search-input').addEventListener('input', filterEvents);
    document.getElementById('category-filter').addEventListener('change', filterEvents);

    window.addEventListener('DOMContentLoaded', loadTimeline);
  </script>
</body>
</html>
