<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linha do Tempo - História Geral</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --card-border: #23314f;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 24px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 600px;
      margin: 0 auto 16px auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .search-input {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 0.9rem;
      width: 260px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .btn-filter {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-filter:hover, .btn-filter.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: var(--accent-blue);
    }

    .timeline-container {
      position: relative;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: linear-gradient(180deg, var(--accent-blue) 0%, var(--card-border) 50%, var(--accent-gold) 100%);
      transform: translateX(-50%);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 40px;
      width: 50%;
      padding: 0 30px;
    }

    .timeline-item.left { left: 0; text-align: right; }
    .timeline-item.right { left: 50%; text-align: left; }

    .timeline-item::after {
      content: '';
      position: absolute;
      top: 20px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 3px solid var(--bg-dark);
      box-shadow: 0 0 8px var(--accent-blue);
      z-index: 2;
    }

    .timeline-item.left::after { right: -10px; }
    .timeline-item.right::after { left: -10px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
    }

    .card-date {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #1e293b;
      color: var(--accent-blue);
      padding: 3px 8px;
      border-radius: 10px;
      margin-left: 8px;
      border: 1px solid var(--card-border);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .timeline-container::before { left: 20px; }
      .timeline-item { width: 100%; padding-left: 45px; padding-right: 0; }
      .timeline-item.left, .timeline-item.right { left: 0; text-align: left; }
      .timeline-item.left::after, .timeline-item.right::after { left: 13px; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="main-title">Linha do Tempo da História</h1>
    <p id="main-desc">Carregando dados...</p>
    
    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar termo, ano ou palavra..." onkeyup="filtrar()">
      <button class="btn-filter active" onclick="filtrarCategoria('todas', this)">Todas</button>
      <button class="btn-filter" onclick="filtrarCategoria('Antiguidade', this)">Antiguidade</button>
      <button class="btn-filter" onclick="filtrarCategoria('Idade Média', this)">Idade Média</button>
      <button class="btn-filter" onclick="filtrarCategoria('Idade Moderna', this)">Idade Moderna</button>
      <button class="btn-filter" onclick="filtrarCategoria('Idade Contemporânea', this)">Contemporânea</button>
      <button class="btn-filter" onclick="filtrarCategoria('Política', this)">Política</button>
      <button class="btn-filter" onclick="filtrarCategoria('Atualidades', this)">Atualidades</button>
    </div>
  </header>

  <div class="timeline-container" id="timeline"></div>

  <script>
    let bancoDados = [];
    let categoriaAtual = 'todas';

    fetch('timeline.json')
      .then(res => res.json())
      .then(data => {
        // Leitura flexível do título para evitar erros [object Object] ou undefined
        if (typeof data.title === 'object' && data.title !== null) {
          document.getElementById('main-title').innerText = data.title.headline || "Linha do Tempo";
          document.getElementById('main-desc').innerText = data.title.text || "História Geral";
        } else if (typeof data.title === 'string') {
          document.getElementById('main-title').innerText = data.title;
          document.getElementById('main-desc').innerText = "Linha do Tempo Histórica";
        }

        // Aceita a chave 'events' ou 'eventos' no JSON
        bancoDados = data.events || data.eventos || [];
        renderizar(bancoDados);
      })
      .catch(err => {
        console.error("Erro ao carregar o JSON:", err);
        document.getElementById('timeline').innerHTML = `<p style="text-align:center; color:#ef4444; width:100%;">Erro ao carregar o arquivo timeline.json. Verifique o formato no repositório.</p>`;
      });

    function formatarAno(ano) {
      if (!ano) return '';
      const num = parseInt(ano, 10);
      if (isNaN(num)) return ano;
      return num < 0 ? `${Math.abs(num)} a.C.` : `${num}`;
    }

    function renderizar(eventos) {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      if (!eventos || eventos.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); width:100%; margin-top:20px;">Nenhum evento encontrado.</p>`;
        return;
      }

      eventos.forEach((evt, index) => {
        const lado = index % 2 === 0 ? 'left' : 'right';
        
        // Tratamento flexível dos campos de cada evento
        const ano = evt.start_date ? evt.start_date.year : (evt.year || '');
        const anoFormatado = formatarAno(ano);
        
        const titulo = evt.text ? (evt.text.headline || evt.text.title) : (evt.headline || evt.title || '');
        const descricao = evt.text ? (evt.text.text || evt.text.desc) : (evt.text || evt.description || '');
        const categoria = evt.category || evt.categoria || 'História';

        const item = document.createElement('div');
        item.className = `timeline-item ${lado}`;
        item.innerHTML = `
          <div class="card">
            <span class="card-date">${anoFormatado}</span>
            <span class="card-badge">${categoria}</span>
            <h2 class="card-title">${titulo}</h2>
            <p class="card-desc">${descricao}</p>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filtrar() {
      if (!bancoDados || bancoDados.length === 0) return;
      const termo = document.getElementById('search-input').value.toLowerCase();

      const filtrados = bancoDados.filter(evt => {
        const cat = evt.category || evt.categoria || '';
        const titulo = evt.text ? (evt.text.headline || '') : (evt.headline || evt.title || '');
        const desc = evt.text ? (evt.text.text || '') : (evt.text || evt.description || '');
        const ano = evt.start_date ? String(evt.start_date.year) : String(evt.year || '');

        const atendeCategoria = categoriaAtual === 'todas' || cat.toLowerCase() === categoriaAtual.toLowerCase();
        const atendeBusca = titulo.toLowerCase().includes(termo) ||
                             desc.toLowerCase().includes(termo) ||
                             ano.includes(termo);

        return atendeCategoria && atendeBusca;
      });

      renderizar(filtrados);
    }

    function filtrarCategoria(cat, btn) {
      categoriaAtual = cat;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtrar();
    }
  </script>
</body>
</html>
