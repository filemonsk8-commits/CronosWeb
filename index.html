<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Linha do Tempo Interativa</title>

  <!-- PWA Settings -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="História PWA">
  
  <!-- Manifest Inline para permitir instalação no Celular/Tablet -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Linha do Tempo Histórica","short_name":"História","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2231/2231467.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.88);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-hover: rgba(51, 65, 85, 0.95);
      --primary-text: #f8fafc;
      --secondary-text: #cbd5e1;
      --accent-color: #38bdf8;
      --accent-year: #fb7185;
      --border-color: rgba(255, 255, 255, 0.15);
      --modal-bg: rgba(15, 23, 42, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('fundo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--primary-text);
      line-height: 1.6;
      padding: 16px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 10px;
    }

    header h1 {
      font-size: 2rem;
      background: linear-gradient(to right, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      font-weight: 800;
    }

    header p {
      font-size: 1rem;
      color: var(--secondary-text);
    }

    .controls {
      max-width: 1000px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 600px) {
      header h1 { font-size: 2.5rem; }
      .controls { flex-direction: row; }
    }

    .search-box, .filter-select {
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 1rem;
      background-color: var(--card-bg);
      color: var(--primary-text);
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-box { flex: 2; }
    .filter-select { flex: 1; cursor: pointer; }

    .search-box:focus, .filter-select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }

    /* Grid de Cards Responsivo */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, background-color 0.2s ease;
      position: relative;
    }

    .card:active {
      transform: scale(0.98);
    }

    @media (min-width: 768px) {
      .card:hover {
        transform: translateY(-4px);
        background-color: var(--card-hover);
        border-color: rgba(56, 189, 248, 0.4);
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-year {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-year);
    }

    .card-category {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-text);
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      color: var(--accent-color);
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Modal / Popup Responsivo */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 0;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    @media (min-width: 600px) {
      .modal-content {
        border-radius: 24px;
        transform: scale(0.95);
      }
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--primary-text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body-text {
      color: var(--secondary-text);
      font-size: 0.95rem;
      margin-top: 16px;
    }

    .section-block {
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .section-title {
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .custom-list {
      list-style: none;
      padding-left: 0;
      margin-top: 6px;
    }

    .custom-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 6px;
    }

    .custom-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--accent-color);
      font-size: 0.75rem;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--secondary-text);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="main-headline">Linha do Tempo Interativa</h1>
    <p id="main-subtext">Carregando dados...</p>
  </header>

  <div class="controls">
    <input type="text" id="search-input" class="search-box" placeholder="Pesquisar por evento, ano ou palavra...">
    <select id="category-filter" class="filter-select">
      <option value="all">Todas as Categorias</option>
    </select>
  </div>

  <div class="cards-grid" id="cards-container"></div>

  <!-- Modal / Detalhes -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="card-header" style="margin-right: 40px;">
        <span class="card-year" id="modal-year"></span>
        <span class="card-category" id="modal-category"></span>
      </div>
      <h2 class="card-title" id="modal-title" style="font-size: 1.4rem; margin-top: 10px;"></h2>
      <div class="modal-body-text" id="modal-body"></div>
    </div>
  </div>

  <script>
    let eventsData = [];

    function formatYear(yearStr) {
      const year = parseInt(yearStr, 10);
      if (isNaN(year)) return yearStr;
      if (year < 0) return `${Math.abs(year)} a.C.`;
      return `${year} d.C.`;
    }

    function formatEventBody(rawText) {
      if (!rawText) return '';
      const lines = rawText.split('\n');
      let htmlOutput = '';
      let inList = false;

      lines.forEach(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith('→') || trimmed.startsWith('-')) {
          if (!inList) {
            htmlOutput += '<ul class="custom-list">';
            inList = true;
          }
          let itemContent = trimmed.replace(/^[→\-]\s*/, '');
          htmlOutput += `<li>${itemContent}</li>`;
        } else {
          if (inList) {
            htmlOutput += '</ul>';
            inList = false;
          }
          if (trimmed === '') {
            htmlOutput += '<div style="height: 8px;"></div>';
          } else if (trimmed.endsWith(':') || trimmed === 'POR QUÊ?') {
            htmlOutput += `<div class="section-block"><span class="section-title">${trimmed}</span></div>`;
          } else {
            htmlOutput += `<p>${trimmed}</p>`;
          }
        }
      });

      if (inList) htmlOutput += '</ul>';
      return htmlOutput;
    }

    async function loadTimeline() {
      try {
        const response = await fetch('timeline.json');
        if (!response.ok) throw new Error('Erro ao carregar timeline.json');
        
        const data = await response.json();

        if (data.title) {
          document.getElementById('main-headline').textContent = data.title.headline || 'Linha do Tempo';
          document.getElementById('main-subtext').textContent = data.title.text || '';
        }

        eventsData = data.events || [];
        populateCategoryFilter(eventsData);
        renderCards(eventsData);

      } catch (error) {
        console.error(error);
        document.getElementById('main-subtext').textContent = 'Certifique-se de que timeline.json está na mesma pasta.';
      }
    }

    function populateCategoryFilter(events) {
      const categorySelect = document.getElementById('category-filter');
      const categories = new Set();
      events.forEach(event => { if (event.category) categories.add(event.category); });
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function renderCards(events) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (events.length === 0) {
        container.innerHTML = '<div class="no-results">Nenhum evento encontrado.</div>';
        return;
      }

      events.forEach(event => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(event);

        const yearText = event.start_date ? formatYear(event.start_date.year) : '';
        const categoryText = event.category || 'Geral';
        const headlineText = event.text ? event.text.headline : '';

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-year">${yearText}</span>
              <span class="card-category">${categoryText}</span>
            </div>
            <h3 class="card-title">${headlineText}</h3>
          </div>
          <div class="card-footer">Toque para ver detalhes</div>
        `;

        container.appendChild(card);
      });
    }

    function openModal(event) {
      document.getElementById('modal-year').textContent = event.start_date ? formatYear(event.start_date.year) : '';
      document.getElementById('modal-category').textContent = event.category || 'Geral';
      document.getElementById('modal-title').textContent = event.text ? event.text.headline : '';
      document.getElementById('modal-body').innerHTML = event.text ? formatEventBody(event.text.text) : '';
      
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function filterEvents() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = eventsData.filter(event => {
        const yearFormatted = event.start_date ? formatYear(event.start_date.year).toLowerCase() : '';
        const rawYear = event.start_date ? event.start_date.year.toString() : '';
        const headline = event.text && event.text.headline ? event.text.headline.toLowerCase() : '';
        const text = event.text && event.text.text ? event.text.text.toLowerCase() : '';
        const category = event.category ? event.category.toLowerCase() : '';

        const matchesSearch = headline.includes(searchTerm) || 
                              text.includes(searchTerm) || 
                              yearFormatted.includes(searchTerm) || 
                              rawYear.includes(searchTerm) ||
                              category.includes(searchTerm);

        const matchesCategory = selectedCategory === 'all' || event.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      renderCards(filtered);
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    document.getElementById('search-input').addEventListener('input', filterEvents);
    document.getElementById('category-filter').addEventListener('change', filterEvents);

    window.addEventListener('DOMContentLoaded', loadTimeline);

    // Registro do Service Worker para permitir instalação como PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
